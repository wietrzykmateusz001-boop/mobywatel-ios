

workflows:
  ios-demo:
    name: iOS Demo
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Build iOS app
        script: |
          xcodebuild \
            -project mObywatel.xcodeproj \
            -scheme MojaAplikacja \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MojaAplikacja.app Payload/
          /usr/bin/zip -r MojaAplikacja-unsigned.ipa Payload

    artifacts:
      - MojaAplikacja-unsigned.ipa
      - build/Build/Products/Release-iphoneos/*.app
