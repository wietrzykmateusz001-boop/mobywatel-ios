
workflows:
  ios-demo:
    name: iOS Demo
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Check project files
        script: |
          echo "Checking Swift files..."
          find . -name "*.swift"
          echo "Checking Xcode projects..."
          find . -name "*.xcodeproj" -o -name "*.xcworkspace"
    artifacts:
      - build/**/*
