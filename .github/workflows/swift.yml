name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: List project files
        run: |
          find . -maxdepth 5 -name '*.xcodeproj' -o -name '*.xcworkspace' -o -name 'Package.swift'

      - name: Check Swift files
        run: |
          find App -name '*.swift'
        
        
