name: iOS Demo Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check project files
        run: |
          find . -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "Package.swift"

      - name: Build Swift package
        run: swift build
        
